name: Bug report
description: Report a reproducible RockxyBase problem that is not a security vulnerability.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Read the [bug reporting guide](https://github.com/RockxyApp/RockxyBase/blob/main/BUG_REPORTING.md) for a complete example. Search existing issues first. Use a disposable or sample database. **Never include credentials, connection strings, private addresses, account names, file paths with your username, licence details, or real database data.** Report security vulnerabilities through a private Security Advisory.
  - type: input
    id: version
    attributes:
      label: RockxyBase version
      description: RockxyBase ▸ About RockxyBase, or Settings ▸ Updates.
      placeholder: "0.x.x (build x)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.x"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Data source
      options:
        - PostgreSQL
        - PostgreSQL via Supabase
        - PostgreSQL via Neon
        - SQL Server
        - Imported file or local database
        - Not database-specific
    validations:
      required: true
  - type: input
    id: engine_version
    attributes:
      label: Database engine version (if applicable)
      placeholder: "For example, PostgreSQL 17"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting (TLS, SSH, credentials)
        - SQL editor or running queries
        - Result grid, copy or export
        - Explore and profiling
        - Model (relationships, measures, calculated fields)
        - Charts
        - Reports and slicers
        - Import
        - Structure changes or editing rows
        - Updates
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a disposable or sample dataset and the smallest repeatable sequence.
      placeholder: |
        1. Connect to …
        2. Run …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include exact error text if available, after removing private details. For a crash, mention whether work was lost.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
        - Unsure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Impact, last working version (if known), and cropped screenshots or short recordings using sample data. Check every frame before attaching.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: "I checked the text and all attachments: they contain no credentials, private addresses, account names, identifying local paths, licence details, or real database data."
          required: true
