name: Bug report
description: Report a reproducible RockxyBase problem that is not a security vulnerability.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve RockxyBase. **Never include passwords, connection strings, API keys, private hostnames or real data from your databases** — use a disposable database or describe the shape of the data instead. Security vulnerabilities belong in a private Security Advisory, not here.
  - type: input
    id: version
    attributes:
      label: RockxyBase version
      description: RockxyBase ▸ About RockxyBase, or Settings ▸ Updates.
      placeholder: "0.1.0 (1)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.5"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database
      options:
        - PostgreSQL
        - PostgreSQL via Supabase
        - PostgreSQL via Neon
        - SQL Server
        - Imported CSV or Excel file
        - Not database-specific
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting (TLS, SSH, credentials)
        - SQL editor or running queries
        - Result grid, copy or export
        - Explore and profiling
        - Model (relationships, measures, calculated fields)
        - Charts
        - Reports and slicers
        - Import
        - Structure changes or editing rows
        - Updates
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Run …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the exact error text if there was one. Remove anything private first.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots (with private data hidden), how often it happens, whether it started after an update.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no passwords, connection strings, private hostnames or real data.
          required: true
